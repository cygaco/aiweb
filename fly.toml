# fly.toml app configuration file generated for aiweb-mcp on 2026-04-23T19:09:22-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aiweb-mcp'
primary_region = 'sjc'

[build]

[env]
  ALLOWED_HOSTS = 'aiweb-mcp.fly.dev'
  DATABASE_PATH = '/data/profiles.db'
  HOST = '0.0.0.0'
  INCLUDE_TEST_RESTAURANTS = 'false'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # SP-20260519-007 T-102 (R-1): eliminate cold-start to stay under
  # mcp-remote's patience window. 'suspend' wakes in ~200ms (vs 'stop'
  # which cold-boots in ~2-3s). Free; fallback is min_machines_running=1
  # (~$3/mo) if suspend is rejected by the VM kind at deploy time.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "aiweb_data"
  destination = "/data"
